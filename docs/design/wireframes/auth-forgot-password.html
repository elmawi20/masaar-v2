<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور — عيادة مسار</title>
  <link rel="stylesheet" href="wireframe.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--wf-surface);
      border: 1px solid var(--wf-border-dark);
      border-radius: 6px;
      padding: 28px;
    }
  </style>
</head>
<body>
  <div class="wf-banner">
    <span>[واجهة سلكية تجريبية - Task 1.15] استعادة كلمة المرور (SCR-A04)</span>
    <a href="index.html">← فهرس جميع الواجهات</a>
  </div>

  <div class="auth-container">
    <div class="auth-box">
      <h2 style="font-size: 18px; margin-bottom: 8px;">استعادة وتعيين كلمة المرور</h2>
      <p style="font-size: 12px; color: var(--wf-text-muted); margin-bottom: 20px;">
        أدخل بريدك الإلكتروني المسجل، ثم رمز التأكيد المؤقت المرسل إليك، وقم بتعيين كلمة مرور جديدة.
      </p>

      <form onsubmit="event.preventDefault(); alert('تم إعادة تعيين كلمة المرور بنجاح. سيتم توجيهك لصفحة تسجيل الدخول.'); window.location.href='auth-login.html';">
        <div class="form-group">
          <label class="form-label" for="reset-email">البريد الإلكتروني للعمل</label>
          <div style="display: flex; gap: 8px;">
            <input type="email" id="reset-email" class="form-control" value="karim.hosny@masaarclinic.com" required>
            <button type="button" class="btn btn-sm" onclick="alert('تم إرسال رمز التحقق إلى بريدك الإلكتروني.');">إرسال الرمز</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-code">رمز التحقق المؤقت (6 أرقام)</label>
          <input type="text" id="reset-code" class="form-control" placeholder="123456" value="782194" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-password">كلمة المرور الجديدة</label>
          <input type="password" id="new-password" class="form-control" placeholder="8 أحرف على الأقل، تتضمن حروف وأرقام" value="MasaarSecure2026!" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">تأكيد كلمة المرور الجديدة</label>
          <input type="password" id="confirm-password" class="form-control" value="MasaarSecure2026!" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 10px;">
          حفظ كلمة المرور وتسجيل الدخول
        </button>
      </form>

      <div style="margin-top: 16px; text-align: center; font-size: 12px;">
        <a href="auth-login.html" style="color: var(--wf-grey-700);">← العودة لصفحة تسجيل الدخول</a>
      </div>
    </div>
  </div>
</body>
</html>
